    <text x="97" y="66" font-size="15" font-weight="700" letter-spacing="2" fill="#243247">CBUC / OPEN SOURCE</text>
    <text x="1144" y="65" text-anchor="end" font-size="12" font-weight="600" letter-spacing="2" fill="#64748B">BUILD. LEARN. SHARE.</text>
    <text x="54" y="139" font-size="23" fill="#54647C">Hi, I'm Cbuc.</text>
    <text x="50" y="213" font-size="68" font-weight="750" letter-spacing="-3" fill="#172B49">Code with purpose.</text>
    <text x="54" y="259" font-size="21" fill="#54647C">Turning ideas into useful software.</text>
    <rect x="54" y="302" width="4" height="18" rx="2" fill="#3266E8"/>
    <text x="72" y="317" font-size="14" font-weight="600" letter-spacing="1.5" fill="#42618B">JAVA / SPRING / WEB APPLICATIONS</text>
