    <path d="m922 169-32 28 32 28m94-56 32 28-32 28m-30-67-25 80" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M874 268h60m12 0h29" stroke="#A9C4FF" stroke-width="5" stroke-linecap="round"/>
