<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cbuc — Code with purpose.</title>
  <desc id="desc">A light editorial banner with a blue code illustration. Java, Spring and web applications. Build, learn, share.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFD"/><stop offset="1" stop-color="#EFF5FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="862" y1="108" x2="1076" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C7EFF"/><stop offset="1" stop-color="#2455D6"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#B8C9E8"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="378" rx="24" fill="url(#paper)" stroke="#E1E8F2" stroke-width="2"/>
  <rect x="768" y="48" width="370" height="286" fill="url(#dots)" opacity=".55"/>
  <g font-family="Segoe UI, Arial, sans-serif">
